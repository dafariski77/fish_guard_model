[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-guard-model"
version = "1.0.0"
description = "FishGuard Edge Computer Vision and Hybrid Risk Scoring Pipeline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "pytest>=7.4.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fish_guard_model*"]
